name: temporary-video-playtest

on:
  push:
    branches:
      - playtest/video-editor

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/enotes-next.log 2>&1 &
          echo $! > /tmp/enotes-next.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/auth/sign-in >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/auth/sign-in >/dev/null
      - name: Headless smoke playtest
        run: |
          npx -y playwright@1.51.0 install chromium --with-deps
          npx -y playwright@1.51.0 test .playtest/video-playtest.spec.js --reporter=line
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/enotes-next.log || true
