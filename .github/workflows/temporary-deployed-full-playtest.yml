name: Temporary deployed full app playtest
on:
  push:
    branches:
      - playtest/full-app
permissions:
  contents: read
jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save @playwright/test@1.51.0
          npx playwright install --with-deps chromium
      - run: npx playwright test .playtest/routes.spec.js --reporter=line
