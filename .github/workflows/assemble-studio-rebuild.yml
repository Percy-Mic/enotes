name: Assemble studio rebuild
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: read
jobs:
  assemble:
    if: startsWith(github.event.comment.body, '/assemble-studio')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        env:
          TARGET_ISSUE: ${{ github.event.issue.number }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.TARGET_ISSUE);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const chunks = comments
              .filter(c => /^STUDIO_CHUNK\s+\d+\n/.test(c.body))
              .sort((a,b) => Number(a.body.match(/^STUDIO_CHUNK\s+(\d+)/)[1]) - Number(b.body.match(/^STUDIO_CHUNK\s+(\d+)/)[1]));
            if (!chunks.length) core.setFailed('No studio chunks found.');
            const component = chunks.map(c => c.body.replace(/^STUDIO_CHUNK\s+\d+\n/, '')).join('');
            const pageComment = comments.find(c => c.body.startsWith('STUDIO_PAGE\n'));
            if (!pageComment) core.setFailed('No studio page payload found.');
            const page = pageComment.body.replace(/^STUDIO_PAGE\n/, '');
            fs.mkdirSync('components/studio', { recursive: true });
            fs.mkdirSync('app/studio/video', { recursive: true });
            fs.writeFileSync('components/studio/ProfessionalVideoStudio.tsx', component);
            fs.writeFileSync('app/studio/video/page.tsx', page);
            core.info(`Wrote studio component: ${component.length} chars`);
            core.info(`Wrote page: ${page.length} chars`);
      - name: Commit rebuild
        run: |
          git config user.name "enotes studio rebuild"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/studio/ProfessionalVideoStudio.tsx app/studio/video/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild video editing studio"
          git push
