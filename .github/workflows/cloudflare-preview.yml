name: Cloudflare preview deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enotes-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Build and deploy preview Worker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/cloudflare-deployment-prep'
    steps:
      - name: Guard against production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/cloudflare-deployment-prep" ]; then
            echo "This workflow is restricted to cloudflare-deployment-prep."
            exit 1
          fi
      - name: Checkout migration branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize lockfile for Cloudflare adapter dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Build OpenNext Worker bundle
        run: npm run build:cloudflare
      - name: Deploy preview Worker only
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
