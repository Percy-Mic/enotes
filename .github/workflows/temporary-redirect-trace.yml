name: Temporary redirect trace
on:
  push:
    branches:
      - playtest/full-app
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.51.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test .playtest/redirect-trace.spec.js --reporter=line
