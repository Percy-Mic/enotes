name: Temporary full app playtest

on:
  push:
    branches:
      - playtest/video-editor-full

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.51.0
          npx playwright install --with-deps chromium
      - name: Build production app
        run: npm run build
      - name: Start production server
        run: |
          npm run start > /tmp/enotes-next.log 2>&1 &
          echo $! > /tmp/enotes-next.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/enotes-next.log
          exit 1
      - name: Run headless playtest
        run: npx playwright test .playtest/video-editor-full.spec.js --reporter=line
      - name: Upload playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enotes-playtest-evidence
          path: |
            /tmp/enotes-next.log
            playtest-results/
          if-no-files-found: ignore
